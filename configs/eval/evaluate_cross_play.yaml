# scripts/eval/evaluate_cross_play.py: cross-play between all agents of each run (paper Fig 6a/15;
# Fig 12 data for Coop Foraging). The environment comes from each run's config.yaml.
defaults:
  - _self_
  - override hydra/job_logging: none   # no <script>.log in the working directory

runs: []                      # run dirs, e.g. [runs/oc_cec,runs/oc_cecp]; all must share one env
eval_name: cross_play         # outputs go to <run>/eval/<eval_name>/
overwrite: false
ckpt: best                    # 'best' or a training step
seed: null                    # null -> each run's general.seed
eval_seed_offset: 300000000
num_episodes: 100             # episodes per pair, one per held-out environment
episode_length: null          # null -> the runs' general.game_length
env_overrides: {}             # e.g. {heldout_layout_num_samples: 100}
eval_original_layouts: true   # Overcooked: also play the five original layouts from their start states

hydra:
  output_subdir: null
  job:
    chdir: false
  run:
    dir: .
