[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cecp"
version = "0.1.0"
description = "Cross-Environment Co-Play (CECP): unifying partner and environment diversity for human-AI coordination"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Patrick Q. Zhang", email = "pqz317@uw.edu"}]
requires-python = ">=3.10"
# Pinned to the stack the paper's models were trained with (JAX 0.4.17/0.4.18-era, Flax 0.7.4).
# Install a CUDA build of jax separately if needed, e.g. `pip install "jax[cuda12_pip]==0.4.18" -f
# https://storage.googleapis.com/jax-releases/jax_cuda_releases.html`.
dependencies = [
    "jax==0.4.18",
    "jaxlib==0.4.18",
    "flax==0.7.4",
    "chex==0.1.84",
    "optax==0.1.7",
    "distrax==0.1.5",
    "numpy==1.26.4",
    "scipy>=1.9,<1.13",  # jax 0.4.18 uses scipy.linalg.tril, removed in scipy 1.13
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "pyyaml",
    "pillow>=10.1",
    "matplotlib",
    "tqdm",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
wandb = ["wandb"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["cecp*"]

[tool.setuptools.package-data]
"cecp.envs.overcooked._jaxmarl" = ["LICENSE-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a GPU (Overcooked / multi-GPU training smoke tests); skipped when none is visible"]
